<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#05070d" />
  <title>FlowSound</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <main class="app">
    <header class="brand">FLOWSOUND</header>

    <section class="card glass now-playing">
      <div class="album-wrap">
        <img id="album-art" alt="Album art" />
      </div>
      <h1 id="track-title">Loading Aura...</h1>
      <p id="artist-name">Connecting to Spotify</p>

      <div class="controls">
        <button id="btn-prev" class="icon-btn" title="Previous track" disabled aria-label="Previous track">
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM20 18V6l-9 6z"/></svg>
        </button>
        <button id="btn-play" class="icon-btn primary" title="Play/Pause" disabled aria-label="Play or pause">
          <svg id="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <svg id="icon-pause" viewBox="0 0 24 24" hidden><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
        </button>
        <button id="btn-next" class="icon-btn" title="Next track" disabled aria-label="Next track">
          <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM4 18V6l9 6z"/></svg>
        </button>
      </div>
    </section>

    <section class="card glass timer">
      <span id="phase-label" class="phase">Focus</span>
      <div id="timer-display">25:00</div>
      <span id="session-label" class="session">Session 1/4</span>

      <div class="controls small">
        <button id="btn-timer-toggle" class="icon-btn" title="Start/Pause timer" aria-label="Start or pause timer">
          <svg id="icon-timer-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <svg id="icon-timer-pause" viewBox="0 0 24 24" hidden><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
        </button>
        <button id="btn-timer-skip" class="icon-btn" title="Skip phase" aria-label="Skip phase">
          <svg viewBox="0 0 24 24"><path d="M4 6v12l7-6zM13 6v12l7-6z"/></svg>
        </button>
        <button id="btn-timer-reset" class="icon-btn" title="Reset timer" aria-label="Reset timer">
          <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
        </button>
      </div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
